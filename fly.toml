# fly.toml app configuration file generated for detonate-v3-7xyz14 on 2026-11-09T16:35:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'detonate-v3-7xyz14'
primary_region = 'iad'
kill_signal = 'SIGINT'
# a l'arret (mise a jour) : le serveur laisse finir les parties en cours, jusqu'a 5 minutes (maximum autorise par Fly)
kill_timeout = '300s'

[build]
[env]
  PORT = '8080'
  PROFILE_REGION = 'iad'
  REGIONS = 'cdg,lax,iad,sin'
  # Mode test des skins : ?skin=all dans l'adresse du jeu debloque tous les skins pour le profil ouvert (?skin=off l'enleve).
  # Pour couper le mode test, supprimer cette ligne : les profils testeurs redeviennent normaux au redemarrage.
  SKINS_ALL_KEY = 'all'
  # Informations légales (mentions légales, CGV, politique de confidentialité) : à remplir, elles s'affichent dans le jeu
  # (pages /mentions-legales, /cgv, /confidentialite). Un champ vide s'affiche « [à compléter] » en orange.
  LEGAL_NOM = ''                 # prénom et nom de l'entrepreneur individuel (ex. 'Jean Dupont')
  LEGAL_ADRESSE = ''             # adresse postale (domicile ou adresse de domiciliation de l'entreprise)
  LEGAL_IMMAT = ''               # immatriculation (ex. 'RCS Pointe-à-Pitre 123 456 789' ou 'RNE, SIREN 123 456 789')
  LEGAL_EMAIL = ''               # e-mail de contact (service client, données personnelles)
  LEGAL_TEL = ''                 # téléphone de contact
  LEGAL_TVA = ''                 # vide = 'TVA non applicable, article 293 B du Code général des impôts' (franchise en base de TVA)
  LEGAL_DIRECTEUR = ''           # directeur de la publication (vide = même personne que LEGAL_NOM)
  LEGAL_MEDIATEUR = ''           # nom du médiateur de la consommation auquel vous avez adhéré
  LEGAL_MEDIATEUR_SITE = ''      # site internet du médiateur
  LEGAL_MEDIATEUR_ADRESSE = ''   # adresse postale du médiateur

[[mounts]]
  source = 'detonate_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
