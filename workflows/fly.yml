# Fly.io depuis le site GitHub, sans terminal :
#   le deploiement se lance tout seul a chaque modification du jeu sur la branche principale (index.html, server.js, profiles.js, fly.toml...) ;
#   une modification du README seul ne relance rien. Pour le relancer a la main : onglet « Actions » du depot
#   -> « Fly : serveurs, volumes et déploiement » -> « Run workflow ».
#   Plusieurs fichiers modifies coup sur coup : le deploiement attend 90 s apres la derniere modification, puis met tout en ligne en une fois
#   (un seul redemarrage des serveurs). Les parties en cours vont jusqu'a leur fin avant que leur serveur ne redemarre (5 min au plus).
# Il faut une seule fois le secret GitHub FLY_API_TOKEN (jeton cree sur fly.io : l'application -> Tokens).
# L'application, la region principale et les regions sont lues dans fly.toml (app, primary_region, REGIONS).
# A chaque lancement :
#   1. verifie l'application et qu'il n'y a pas deux machines dans une meme region ;
#   2. cree la cle PROFILE_KEY (une seule fois) et les volumes manquants des machines existantes ;
#   3. deploie la version du depot ;
#   4. ajoute une machine (512 Mo, copie de celle de la region principale, avec son propre volume de 1 Go)
#      dans chaque region de REGIONS qui n'en a pas encore.
# Sans risque si on le relance : rien n'est cree deux fois, les profils (volume /data de la region principale) restent.
name: "Fly : serveurs, volumes et déploiement"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '**.md'
      - '.gitignore'
jobs:
  # attente apres une modification : une nouvelle modification pendant ces 90 s annule l'attente precedente,
  # si bien que plusieurs fichiers envoyes a la suite ne donnent qu'un seul deploiement
  attente:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-attente
      cancel-in-progress: true
    steps:
      - run: sleep 90
  fly:
    needs: attente
    if: always() && (needs.attente.result == 'success' || needs.attente.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency: fly-deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ORG: personal
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Application et régions (lues dans fly.toml)
        run: |
          val() { sed -n "s/^ *$1 *= *['\"]\([^'\"]*\)['\"].*/\1/p" fly.toml | head -1; }
          APP=$(val app); PRI=$(val primary_region); REG=$(val REGIONS | tr ',' ' ')
          if [ -z "$APP" ] || [ -z "$PRI" ] || [ -z "$REG" ]; then echo "::error::app, primary_region ou REGIONS introuvable dans fly.toml"; exit 1; fi
          echo "APP=$APP" >> "$GITHUB_ENV"; echo "PRI=$PRI" >> "$GITHUB_ENV"; echo "REG=$REG" >> "$GITHUB_ENV"
          echo "Application : $APP · région principale : $PRI · régions : $REG"
      - name: Application (créée si elle n'existe pas encore)
        run: |
          if flyctl status -a "$APP" >/dev/null 2>&1; then
            echo "$APP existe"
          else
            flyctl apps create "$APP" --org "$ORG" || { echo "::error::Impossible de créer $APP : il faut un jeton d'organisation, ou le nom est déjà pris (change app dans fly.toml)."; exit 1; }
          fi
      - name: Une seule machine par région
        run: |
          mj() { o=$(flyctl machine list -a "$APP" --json 2>/dev/null) || o='[]'; echo "$o" | jq -e 'type=="array"' >/dev/null 2>&1 || o='[]'; echo "$o"; }
          flyctl machine list -a "$APP" || true
          dup=$(mj | jq -r '.[].region' | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::Plusieurs machines dans la région $dup : les salons et les profils seraient coupés en deux. Supprime la machine en trop sur fly.io (Machines), puis relance."
            exit 1
          fi
      - name: Clé partagée entre les serveurs (créée une seule fois)
        run: |
          if flyctl secrets list -a "$APP" | grep PROFILE_KEY >/dev/null; then
            echo "PROFILE_KEY déjà présente"
          else
            flyctl secrets set PROFILE_KEY="$(openssl rand -hex 32)" -a "$APP" --stage
          fi
      - name: Volumes des machines existantes (créés seulement s'ils manquent)
        run: |
          mj() { o=$(flyctl machine list -a "$APP" --json 2>/dev/null) || o='[]'; echo "$o" | jq -e 'type=="array"' >/dev/null 2>&1 || o='[]'; echo "$o"; }
          vl=$(flyctl volumes list -a "$APP")
          have=$(mj | jq -r '.[].region' | sort -u)
          [ -z "$have" ] && have="$PRI"   # nouvelle application : la premiere machine sera dans la region principale
          for r in $have; do
            if echo "$vl" | grep detonate_data | grep -w "$r" >/dev/null; then
              echo "$r : volume présent"
            else
              flyctl volumes create detonate_data -a "$APP" -r "$r" -s 1 -y
            fi
          done
      - name: Déploiement
        run: flyctl deploy --remote-only --ha=false --wait-timeout 10m -a "$APP"   # un serveur peut attendre la fin d'une partie (5 min au plus) avant de redemarrer
      - name: Une machine dans chaque région de REGIONS
        run: |
          mj() { o=$(flyctl machine list -a "$APP" --json 2>/dev/null) || o='[]'; echo "$o" | jq -e 'type=="array"' >/dev/null 2>&1 || o='[]'; echo "$o"; }
          ms=$(mj)
          src=$(echo "$ms" | jq -r --arg p "$PRI" '[.[] | select(.region==$p)][0].id // .[0].id // empty')
          if [ -z "$src" ]; then echo "::error::Aucune machine à copier."; exit 1; fi
          for r in $REG; do
            if echo "$ms" | jq -e --arg r "$r" 'any(.[]; .region==$r)' >/dev/null; then
              echo "$r : machine présente"
            else
              echo "$r : nouvelle machine (copie de $src, nouveau volume de 1 Go)"
              flyctl machine clone "$src" --region "$r" -a "$APP"
            fi
          done
          flyctl machine list -a "$APP"
          flyctl volumes list -a "$APP"
          echo "Jeu en ligne : https://$APP.fly.dev"
